name: tiki_taka_scoreboard_desktop
description: Desktop application for Tiki-Taka system for real-time scoreboard.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.35.6"

dependencies:
  bloc: ^9.2.0
  cloud_firestore: ^6.1.2
  device_info_plus: ^12.3.0
  equatable: ^2.0.8
  firebase_core: ^4.4.0
  fluent_ui: ^4.13.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_in_app_pip: ^1.7.4
  flutter_local_notifications: ^20.0.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.0
  hugeicons: ^1.1.5
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.4
  shimmer_animation: ^2.2.2
  text_scroll: ^0.2.1
  user_api:
    path: packages/user_api
  user_api_remote:
    path: packages/user_api_remote
  user_repository:
    path: packages/user_repository

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.10.5
  firebase_core_platform_interface: ^7.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mockito: ^5.6.3
  mocktail: ^1.0.4
  msix: ^3.16.13
  plugin_platform_interface: ^2.1.8
  test_coverage_badge: ^0.3.2
  very_good_analysis: ^10.1.0

flutter_launcher_icons:
  android: false
  ios: false
  web:
    generate: true
    image_path: "assets/logo-web.png"
    background_color: "transparent"
  windows:
   generate: true
   image_path: "assets/logo-windows.png"
   icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo-macos.png"

msix_config:
  display_name: Tiki-Taka
  publisher_display_name: Piero Angelo Morales Alcalde
  identity_name: 29622PieroAngeloMoralesAl.ScoreboardDesktop
  publisher: CN=91BE0923-E8F6-4F62-AE9E-2A123C9AC1AF
  msix_version: 2.0.0.0
  languages: es-es, en-us, it-it
  logo_path: assets/logo-windows.png
  capabilities: internetClient
  store: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/